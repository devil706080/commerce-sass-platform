[project]
name = "platform-control-plane"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "PyJWT[crypto]>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL credentials"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
