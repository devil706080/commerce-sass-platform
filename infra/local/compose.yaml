name: commerce-saas-platform

services:
  keycloak:
    profiles: ["identity"]
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      LOCAL_OPERATOR_EMAIL: ${LOCAL_OPERATOR_EMAIL:-}
      LOCAL_OPERATOR_PASSWORD: ${LOCAL_OPERATOR_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/platform-local-realm.json:/opt/keycloak/data/import/platform-local-realm.json:ro
    security_opt:
      - no-new-privileges:true

  platform-control:
    profiles: ["platform-control"]
    build:
      context: ../../backend/services/platform-control-plane
      args:
        PROVISIONED_SECRETS_READER_GID: ${PROVISIONED_SECRETS_READER_GID:?Configure PROVISIONED_SECRETS_READER_GID in .env}
    environment:
      DB_HOST: postgres
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      LOCAL_TENANT_LABELS: ${LOCAL_TENANT_LABELS:-}
      TENANT_CONTEXT_BROKER_TOKEN: ${TENANT_CONTEXT_BROKER_TOKEN:?Run scripts/bootstrap_identity.py first}
      TENANT_CONTEXT_SIGNING_SECRET: ${TENANT_CONTEXT_SIGNING_SECRET:?Run scripts/bootstrap_identity.py first}
      OIDC_ISSUER: http://localhost:8080/realms/platform-local
      OIDC_AUDIENCE: control-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/platform-local/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PLATFORM_CONTROL_RUNTIME_PASSWORD: ${PLATFORM_CONTROL_RUNTIME_PASSWORD:?Run scripts/bootstrap_local.py first}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  platform-provisioner:
    profiles: ["provisioning"]
    build:
      context: ../../backend/services/platform-control-plane
      args:
        PROVISIONED_SECRETS_READER_GID: ${PROVISIONED_SECRETS_READER_GID:?Configure PROVISIONED_SECRETS_READER_GID in .env}
    command: ["python", "-m", "platform_control_plane.worker.main"]
    environment:
      DB_HOST: postgres
      PLATFORM_CONTROL_WORKER_PASSWORD: ${PLATFORM_CONTROL_WORKER_PASSWORD:?Run scripts/bootstrap_local.py first}
      TENANT_DATABASE_PROVISIONER_PASSWORD: ${TENANT_DATABASE_PROVISIONER_PASSWORD:?Run scripts/bootstrap_local.py first}
      LOCAL_PROVISIONED_SECRETS_DIR: /var/lib/platform-secrets
    volumes:
      - provisioned_secrets:/var/lib/platform-secrets
    group_add:
      - "${PROVISIONED_SECRETS_READER_GID:?Configure PROVISIONED_SECRETS_READER_GID in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true

  platform-control-migrate:
    profiles: ["migration"]
    build:
      context: ../../backend/services/platform-control-plane
      args:
        PROVISIONED_SECRETS_READER_GID: ${PROVISIONED_SECRETS_READER_GID:?Configure PROVISIONED_SECRETS_READER_GID in .env}
    command: ["alembic", "upgrade", "head"]
    environment:
      DB_HOST: postgres
      PLATFORM_CONTROL_MIGRATOR_PASSWORD: ${PLATFORM_CONTROL_MIGRATOR_PASSWORD:?Run scripts/bootstrap_local.py first}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  platform-service-migrate:
    profiles: ["service-migration"]
    build:
      context: ../../backend/services/platform-control-plane
      args:
        PROVISIONED_SECRETS_READER_GID: ${PROVISIONED_SECRETS_READER_GID:?Configure PROVISIONED_SECRETS_READER_GID in .env}
    command: ["python", "-m", "platform_control_plane.worker.service_migrations"]
    environment:
      DB_HOST: postgres
      PLATFORM_CONTROL_WORKER_PASSWORD: ${PLATFORM_CONTROL_WORKER_PASSWORD:?Run scripts/bootstrap_local.py first}
      TENANT_DATABASE_PROVISIONER_PASSWORD: ${TENANT_DATABASE_PROVISIONER_PASSWORD:?Run scripts/bootstrap_local.py first}
      LOCAL_PROVISIONED_SECRETS_DIR: /var/lib/platform-secrets
    volumes:
      - provisioned_secrets:/var/lib/platform-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  platform-console:
    profiles: ["platform-console"]
    build:
      context: ../../frontend
      dockerfile: apps/platform-console/Dockerfile
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: platform-local
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: platform-console
        NEXT_PUBLIC_CONTROL_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: platform-local
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: platform-console
      NEXT_PUBLIC_CONTROL_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - keycloak
      - platform-control
    security_opt:
      - no-new-privileges:true

  identity-access:
    profiles: ["identity-access"]
    build:
      context: ../../backend/services/identity-access
    environment:
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_PORT: 5432
      IDENTITY_SCHEMA: identity
      IDENTITY_OIDC_ISSUER: http://localhost:8080/realms/platform-local
      IDENTITY_OIDC_AUDIENCE: identity-api
      IDENTITY_OIDC_JWKS_URL: http://keycloak:8080/realms/platform-local/protocol/openid-connect/certs
      IDENTITY_CORS_ORIGINS: ${IDENTITY_CORS_ORIGINS:-[]}
      TENANT_CONTEXT_SIGNING_SECRET: ${TENANT_CONTEXT_SIGNING_SECRET:?Run scripts/bootstrap_identity.py first}
      PROVISIONED_SECRETS_DIR: /var/lib/platform-secrets
    ports:
      - "127.0.0.1:8030:8030"
    volumes:
      - provisioned_secrets:/var/lib/platform-secrets:ro
    group_add:
      - "${PROVISIONED_SECRETS_READER_GID:?Configure PROVISIONED_SECRETS_READER_GID in .env}"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  identity-config-sync:
    profiles: ["identity-access"]
    build:
      context: ../../backend/services/identity-access
    command: ["python", "-m", "identity_access.infrastructure.keycloak_sync"]
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: platform-local
      KEYCLOAK_TENANT_ADMIN_CLIENT_ID: tenant-admin
      KEYCLOAK_TENANT_ADMIN_AUDIENCES: identity-api,catalogue-api,media-api,inventory-api
      KEYCLOAK_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Run scripts/bootstrap_identity.py first}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Run scripts/bootstrap_identity.py first}
      CONTROL_PLANE_INTERNAL_URL: http://platform-control:8000
      TENANT_CONTEXT_BROKER_TOKEN: ${TENANT_CONTEXT_BROKER_TOKEN:?Run scripts/bootstrap_identity.py first}
      TENANT_ADMIN_ORIGIN_TEMPLATE: ${TENANT_ADMIN_ORIGIN_TEMPLATE:?Run scripts/bootstrap_identity.py first}
      TENANT_ADMIN_BOOTSTRAP_ORIGINS: ${TENANT_ADMIN_BOOTSTRAP_ORIGINS:-http://localhost:3001}
      KEYCLOAK_SYNC_INTERVAL_SECONDS: ${KEYCLOAK_SYNC_INTERVAL_SECONDS:-15}
    depends_on:
      - keycloak
      - platform-control
    restart: unless-stopped
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true

  identity-access-migrate:
    profiles: ["identity-migration"]
    build:
      context: ../../backend/services/identity-access
    command: ["python", "-m", "identity_access.infrastructure.migrate"]
    environment:
      IDENTITY_TENANT_ID: ${IDENTITY_TENANT_ID:-}
      IDENTITY_ALLOWED_HOSTS: ${IDENTITY_ALLOWED_HOSTS:-}
      IDENTITY_DATABASE_NAME: ${IDENTITY_DATABASE_NAME:-}
      IDENTITY_RUNTIME_ROLE: ${IDENTITY_RUNTIME_ROLE:-}
      IDENTITY_MIGRATOR_ROLE: ${IDENTITY_MIGRATOR_ROLE:-}
      IDENTITY_SECRET_FILE: /var/lib/identity-secrets/database.json
      IDENTITY_DB_HOST: postgres
      IDENTITY_DB_PORT: 5432
      IDENTITY_SCHEMA: identity
      IDENTITY_OIDC_ISSUER: http://localhost:8080/realms/platform-local
      IDENTITY_OIDC_AUDIENCE: identity-api
      IDENTITY_OIDC_JWKS_URL: http://keycloak:8080/realms/platform-local/protocol/openid-connect/certs
    volumes:
      - identity_secrets:/var/lib/identity-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  catalogue:
    profiles: ["catalogue"]
    build:
      context: ../../backend/services/catalogue
      dockerfile: Dockerfile
    environment:
      CATALOGUE_DB_HOST: postgres
      CATALOGUE_DB_PORT: 5432
      CATALOGUE_OIDC_ISSUER: http://localhost:8080/realms/platform-local
      CATALOGUE_OIDC_AUDIENCE: catalogue-api
      CATALOGUE_OIDC_JWKS_URL: http://keycloak:8080/realms/platform-local/protocol/openid-connect/certs
      CATALOGUE_SCHEMA: ${CATALOGUE_SCHEMA:-catfx}
      TENANT_CONTEXT_SIGNING_SECRET: ${TENANT_CONTEXT_SIGNING_SECRET:?Run scripts/bootstrap_identity.py first}
      PROVISIONED_SECRETS_DIR: /var/lib/platform-secrets
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - provisioned_secrets:/var/lib/platform-secrets:ro
    group_add:
      - "${PROVISIONED_SECRETS_READER_GID:?Configure PROVISIONED_SECRETS_READER_GID in .env}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  tenant-admin:
    profiles: ["tenant-admin"]
    build:
      context: ../../frontend
      dockerfile: apps/tenant-admin/Dockerfile
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: platform-local
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: tenant-admin
    environment:
      CONTROL_PLANE_INTERNAL_URL: http://platform-control:8000
      IDENTITY_API_INTERNAL_URL: http://identity-access:8030
      CATALOGUE_API_INTERNAL_URL: http://catalogue:8010
      INVENTORY_API_INTERNAL_URL: http://inventory:8040
      MEDIA_API_INTERNAL_URL: http://media:8020
      TENANT_CONTEXT_BROKER_TOKEN: ${TENANT_CONTEXT_BROKER_TOKEN:?Run scripts/bootstrap_identity.py first}
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: platform-local
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: tenant-admin
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - keycloak
      - identity-access
      - catalogue
      - inventory
      - media
      - platform-control
    security_opt:
      - no-new-privileges:true

  media:
    profiles: ["media"]
    build:
      context: ../../backend/services/media
    environment:
      MEDIA_DB_HOST: postgres
      MEDIA_DB_PORT: 5432
      MEDIA_SCHEMA: medfx
      MEDIA_STORAGE_ROOT: /var/lib/commerce-media
      MEDIA_OIDC_ISSUER: http://localhost:8080/realms/platform-local
      MEDIA_OIDC_AUDIENCE: media-api
      MEDIA_OIDC_JWKS_URL: http://keycloak:8080/realms/platform-local/protocol/openid-connect/certs
      TENANT_CONTEXT_SIGNING_SECRET: ${TENANT_CONTEXT_SIGNING_SECRET:?Run scripts/bootstrap_identity.py first}
      PROVISIONED_SECRETS_DIR: /var/lib/platform-secrets
    ports:
      - "127.0.0.1:8020:8020"
    volumes:
      - provisioned_secrets:/var/lib/platform-secrets:ro
      - tenant_media:/var/lib/commerce-media
    group_add:
      - "${PROVISIONED_SECRETS_READER_GID:?Configure PROVISIONED_SECRETS_READER_GID in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  storefront:
    profiles: ["storefront"]
    build:
      context: ../../frontend
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: platform-local
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: storefront
    environment:
      CATALOGUE_API_INTERNAL_URL: http://catalogue:8010
      CONTROL_PLANE_INTERNAL_URL: http://platform-control:8000
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: platform-local
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: storefront
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - keycloak
      - catalogue
      - platform-control
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  inventory:
    profiles: ["inventory"]
    build:
      context: ../../backend/services/inventory
    environment:
      INVENTORY_DB_HOST: postgres
      INVENTORY_DB_PORT: 5432
      INVENTORY_SCHEMA: invfx
      INVENTORY_OIDC_ISSUER: http://localhost:8080/realms/platform-local
      INVENTORY_OIDC_AUDIENCE: inventory-api
      INVENTORY_OIDC_JWKS_URL: http://keycloak:8080/realms/platform-local/protocol/openid-connect/certs
      TENANT_CONTEXT_SIGNING_SECRET: ${TENANT_CONTEXT_SIGNING_SECRET:?Run scripts/bootstrap_identity.py first}
      PROVISIONED_SECRETS_DIR: /var/lib/platform-secrets
    ports:
      - "127.0.0.1:8040:8040"
    volumes:
      - provisioned_secrets:/var/lib/platform-secrets:ro
    group_add:
      - "${PROVISIONED_SECRETS_READER_GID:?Configure PROVISIONED_SECRETS_READER_GID in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_control
      POSTGRES_USER: local_bootstrap_admin
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Run scripts/bootstrap_local.py first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PLATFORM_CONTROL_RUNTIME_PASSWORD: ${PLATFORM_CONTROL_RUNTIME_PASSWORD:?Run scripts/bootstrap_local.py first}
      PLATFORM_CONTROL_MIGRATOR_PASSWORD: ${PLATFORM_CONTROL_MIGRATOR_PASSWORD:?Run scripts/bootstrap_local.py first}
      PLATFORM_CONTROL_WORKER_PASSWORD: ${PLATFORM_CONTROL_WORKER_PASSWORD:?Run scripts/bootstrap_local.py first}
      TENANT_DATABASE_PROVISIONER_PASSWORD: ${TENANT_DATABASE_PROVISIONER_PASSWORD:?Run scripts/bootstrap_local.py first}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 60s

  redis:
    image: redis:8.10.3
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/bootstrap_local.py first}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./secrets/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  rabbitmq:
    image: rabbitmq:4.4.0-management
    profiles: ["messaging"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-local_dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Run scripts/bootstrap_local.py first}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  keycloak_data:
  postgres_data:
  redis_data:
  rabbitmq_data:
  provisioned_secrets:
  identity_secrets:
  tenant_media:
