name: commerce-saas-platform

services:
  keycloak:
    profiles: ["identity"]
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      LOCAL_OPERATOR_EMAIL: ${LOCAL_OPERATOR_EMAIL:-}
      LOCAL_OPERATOR_PASSWORD: ${LOCAL_OPERATOR_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/platform-local-realm.json:/opt/keycloak/data/import/platform-local-realm.json:ro
    security_opt:
      - no-new-privileges:true

  platform-control:
    profiles: ["platform-control"]
    build:
      context: ../../backend/services/platform-control-plane
    environment:
      DB_HOST: postgres
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      LOCAL_TENANT_LABELS: ${LOCAL_TENANT_LABELS:-}
      OIDC_ISSUER: http://localhost:8080/realms/platform-local
      OIDC_AUDIENCE: control-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/platform-local/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PLATFORM_CONTROL_RUNTIME_PASSWORD: ${PLATFORM_CONTROL_RUNTIME_PASSWORD:?Run scripts/bootstrap_local.py first}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  platform-provisioner:
    profiles: ["provisioning"]
    build:
      context: ../../backend/services/platform-control-plane
    command: ["python", "-m", "platform_control_plane.worker.main"]
    environment:
      DB_HOST: postgres
      PLATFORM_CONTROL_WORKER_PASSWORD: ${PLATFORM_CONTROL_WORKER_PASSWORD:?Run scripts/bootstrap_local.py first}
      TENANT_DATABASE_PROVISIONER_PASSWORD: ${TENANT_DATABASE_PROVISIONER_PASSWORD:?Run scripts/bootstrap_local.py first}
      LOCAL_PROVISIONED_SECRETS_DIR: /var/lib/platform-secrets
    volumes:
      - provisioned_secrets:/var/lib/platform-secrets
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true

  platform-control-migrate:
    profiles: ["migration"]
    build:
      context: ../../backend/services/platform-control-plane
    command: ["alembic", "upgrade", "head"]
    environment:
      DB_HOST: postgres
      PLATFORM_CONTROL_MIGRATOR_PASSWORD: ${PLATFORM_CONTROL_MIGRATOR_PASSWORD:?Run scripts/bootstrap_local.py first}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  platform-service-migrate:
    profiles: ["service-migration"]
    build:
      context: ../../backend/services/platform-control-plane
    command: ["python", "-m", "platform_control_plane.worker.service_migrations"]
    environment:
      DB_HOST: postgres
      PLATFORM_CONTROL_WORKER_PASSWORD: ${PLATFORM_CONTROL_WORKER_PASSWORD:?Run scripts/bootstrap_local.py first}
      TENANT_DATABASE_PROVISIONER_PASSWORD: ${TENANT_DATABASE_PROVISIONER_PASSWORD:?Run scripts/bootstrap_local.py first}
      LOCAL_PROVISIONED_SECRETS_DIR: /var/lib/platform-secrets
    volumes:
      - provisioned_secrets:/var/lib/platform-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  platform-console:
    profiles: ["platform-console"]
    build:
      context: ../../frontend
      dockerfile: apps/platform-console/Dockerfile
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: platform-local
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: platform-console
        NEXT_PUBLIC_CONTROL_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: platform-local
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: platform-console
      NEXT_PUBLIC_CONTROL_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - keycloak
      - platform-control
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_control
      POSTGRES_USER: local_bootstrap_admin
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Run scripts/bootstrap_local.py first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PLATFORM_CONTROL_RUNTIME_PASSWORD: ${PLATFORM_CONTROL_RUNTIME_PASSWORD:?Run scripts/bootstrap_local.py first}
      PLATFORM_CONTROL_MIGRATOR_PASSWORD: ${PLATFORM_CONTROL_MIGRATOR_PASSWORD:?Run scripts/bootstrap_local.py first}
      PLATFORM_CONTROL_WORKER_PASSWORD: ${PLATFORM_CONTROL_WORKER_PASSWORD:?Run scripts/bootstrap_local.py first}
      TENANT_DATABASE_PROVISIONER_PASSWORD: ${TENANT_DATABASE_PROVISIONER_PASSWORD:?Run scripts/bootstrap_local.py first}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 60s

  redis:
    image: redis:8.10.3
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/bootstrap_local.py first}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./secrets/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  rabbitmq:
    image: rabbitmq:4.4.0-management
    profiles: ["messaging"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-local_dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Run scripts/bootstrap_local.py first}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  keycloak_data:
  postgres_data:
  redis_data:
  rabbitmq_data:
  provisioned_secrets:
